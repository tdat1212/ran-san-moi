<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rắn săn mồi</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;background-color:#17231f;background-image:linear-gradient(135deg,#202f27 0%,#111b19 55%,#20251c 100%),repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 34px);background-blend-mode:normal,screen;color:#f5f0df;font:16px system-ui,sans-serif}
    .game{width:min(100%,520px);text-align:center}
    h1{margin:0;font-family:Georgia,serif;font-size:2.5rem;font-weight:700;line-height:1.1;color:#f4eed9}
    .subtitle{margin:9px 0 20px;color:#b8c5b7}
    .scorebar{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;margin:0 0 11px;border:1px solid #536455;border-radius:10px;background:#29372ebf;box-shadow:0 8px 24px #09100d55}
    .score{display:inline-block;min-width:2.4ch;margin-left:5px;color:#f2c66d;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
    button{min-height:42px;padding:9px 17px;border:1px solid #f3d28b;border-radius:7px;background:#f0c66f;color:#24291f;font:inherit;font-weight:750;cursor:pointer;transition:transform .16s ease,background .16s ease}
    button:hover{transform:translateY(-2px);background:#ffda87}
    button:focus-visible{outline:3px solid #fff2c5;outline-offset:3px}
    .board{position:relative;border:2px solid #697c68;border-radius:10px;overflow:hidden;background:#15251e;box-shadow:0 18px 50px #080f0c88,0 0 0 6px #ffffff08}
    canvas{display:block;width:100%;height:auto}
    .overlay{position:absolute;inset:0;display:grid;place-content:center;gap:12px;background:#101b17d9;backdrop-filter:blur(3px)}
    .overlay[hidden]{display:none}
    .overlay strong{font-family:Georgia,serif;font-size:2rem;color:#f5d78f}
    .overlay span{color:#e0e3d3}
    .help{margin:16px 0 0;color:#b8c5b7;font-size:.9rem}
    .pad{display:none;grid-template:repeat(2,48px)/repeat(3,55px);gap:6px;justify-content:center;margin-top:14px}
    .pad button{min-height:0;padding:0;border-color:#6e806e;background:#32453a;color:#f5f0df;font-size:1.2rem}
    .pad button:hover{background:#46604d}
    .pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}
    @media(pointer:coarse),(max-width:600px){.pad{display:grid}h1{font-size:2.15rem}.subtitle{font-size:.94rem}}
  </style>
</head>
<body>
  <main class="game">
    <h1>🐍 RẮN SĂN MỒI</h1><p class="subtitle">Ăn mồi để ghi điểm, đừng đâm vào tường hay chính mình!</p>
    <div class="scorebar"><span>Điểm: <b class="score" id="score">0</b></span><button id="start">Bắt đầu</button></div>
    <div class="board"><canvas id="canvas" width="480" height="480"></canvas><div class="overlay" id="overlay"><strong>Sẵn sàng?</strong><span>Nhấn Bắt đầu để chơi</span></div></div>
    <div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
    <p class="help">Điều khiển bằng phím mũi tên hoặc WASD · Phím cách để tạm dừng</p>
  </main>
  <script>
    const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreNode=document.getElementById('score');
    const count=24,cell=canvas.width/count;let snake=[],food,dir={x:1,y:0},nextDir=dir,score=0,timer=null,playing=false;
    function draw(){ctx.fillStyle='#182b22';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#e5edcf0c';ctx.lineWidth=1;for(let i=0;i<=count;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(480,i*cell);ctx.stroke()}if(!snake.length)return;const fx=(food.x+.5)*cell,fy=(food.y+.5)*cell;ctx.save();ctx.shadowColor='#f0785d';ctx.shadowBlur=16;ctx.fillStyle='#ef795e';ctx.beginPath();ctx.arc(fx,fy,cell*.34,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#f6b36e';ctx.beginPath();ctx.ellipse(fx-cell*.04,fy-cell*.08,cell*.09,cell*.15,-.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b9d77a';ctx.beginPath();ctx.ellipse(fx+cell*.19,fy-cell*.3,cell*.13,cell*.07,-.6,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{const inset=i===0?1.5:2.5,x=p.x*cell+inset,y=p.y*cell+inset,size=cell-inset*2;const gradient=ctx.createLinearGradient(x,y+size,x+size,y);gradient.addColorStop(0,i?'#55aa78':'#a9d77d');gradient.addColorStop(1,i?'#8bc77d':'#e0e99b');ctx.fillStyle=gradient;ctx.beginPath();ctx.roundRect(x,y,size,size,cell*.32);ctx.fill();if(i===0){const ex=dir.x===1?x+size*.73:dir.x===-1?x+size*.27:x+size*.68,ey=dir.y===1?y+size*.73:dir.y===-1?y+size*.27:y+size*.3;const ex2=dir.y?x+size*.32:ex,ey2=dir.x?y+size*.32:ey;ctx.fillStyle='#233027';ctx.beginPath();ctx.arc(ex,ey,2.2,0,Math.PI*2);ctx.arc(ex2,ey2,2.2,0,Math.PI*2);ctx.fill()}})}
    function makeFood(){do{food={x:Math.floor(Math.random()*count),y:Math.floor(Math.random()*count)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
    function start(){clearInterval(timer);snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};nextDir=dir;score=0;scoreNode.textContent=score;makeFood();playing=true;overlay.hidden=true;document.getElementById('start').textContent='Chơi lại';draw();timer=setInterval(tick,140)}
    function finish(){playing=false;clearInterval(timer);overlay.innerHTML='<strong>המשחק נגמר!</strong><span>הניקוד שלך: '+score+'</span><button id="again">שחק שוב</button>';overlay.hidden=false;document.getElementById('again').onclick=start}
    function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=head.x===food.x&&head.y===food.y,body=eat?snake:snake.slice(0,-1);if(head.x<0||head.x>=count||head.y<0||head.y>=count||body.some(p=>p.x===head.x&&p.y===head.y))return finish();snake.unshift(head);if(eat){score+=10;scoreNode.textContent=score;makeFood();clearInterval(timer);timer=setInterval(tick,Math.max(65,140-score))}else snake.pop();draw()}
    function turn(name){const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}},n=map[name];if(n&&(n.x!==-dir.x||n.y!==-dir.y))nextDir=n}
    document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();if(playing)turn(map[e.key]);else if(e.key.startsWith('Arrow'))start()}if(e.code==='Space'){e.preventDefault();if(playing){playing=false;clearInterval(timer);overlay.innerHTML='<strong>Tạm dừng</strong><button id="resume">Tiếp tục</button>';overlay.hidden=false;document.getElementById('resume').onclick=()=>{overlay.hidden=true;playing=true;timer=setInterval(tick,140)}}else if(snake.length&&!overlay.hidden===false){}}});
    document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(playing)turn(b.dataset.dir);else start()});document.getElementById('start').onclick=start;draw();
  </script>
</body>
</html>
